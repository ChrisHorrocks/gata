services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gata
      POSTGRES_PASSWORD: gata
      POSTGRES_DB: gata
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gata -d gata"]
      interval: 2s
      timeout: 5s
      retries: 15

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://gata:gata@postgres:5432/gata
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_FROM: noreply@example.com
      APP_PUBLIC_URL: http://localhost:5173
      JWT_ISSUER: http://localhost:5173
      # Dev-only CSRF signing key (set CSRF_SECRET or CSRF_SECRET_FILE in real deployments).
      CSRF_SECRET: dev-csrf-secret-not-for-production
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend:/app
    working_dir: /app

  caddy:
    image: caddy:2-alpine
    environment:
      TILES_ROOT: /srv/tiles
    ports:
      - "8080:8080"
    volumes:
      - ./tiles/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./tiles/data:/srv/tiles:ro

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
      VITE_TILES_PROXY_TARGET: http://caddy:8080
      VITE_MAP_PMTILES_PATH: /tiles/dev-small.pmtiles
      VITE_MAP_ELEVATION_PMTILES_PATH: /tiles/dev-elevation.pmtiles
      VITE_MAP_ASSETS_PREFIX: /tiles/basemaps-assets
    ports:
      - "5173:5173"
    depends_on:
      - backend
      - caddy
    # Default CMD from frontend/Dockerfile; entrypoint runs npm ci when package-lock.json changes.
    volumes:
      - ./frontend:/app
      - /app/node_modules
    working_dir: /app