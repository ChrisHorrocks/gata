name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gata
          POSTGRES_PASSWORD: gata
          POSTGRES_DB: gata
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://gata:gata@localhost:5432/gata
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[dev]" pyright
      - name: Ruff
        run: .venv/bin/ruff check .
      - name: Mypy
        run: .venv/bin/mypy app
      - name: Pyright
        run: .venv/bin/pyright
      - name: Pytest
        run: .venv/bin/pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        run: npm ci
      - name: ESLint and oxlint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Vitest
        run: npm test